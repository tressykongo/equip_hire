
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Equip-Hire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #252525;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.09);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            color: #f28c28;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .brand p {
            color: #666;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        form input,
        form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        form input:focus,
        form select:focus {
            outline: none;
            border-color: #f28c28;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }

        ul.errorlist {
            color: #c0392b;
            font-size: 13px;
            padding-left: 20px;
        }

        .register-button {
            width: 100%;
            background: #f28c28;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .register-button:hover {
            background: #d97716;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-link a {
            color: #e67e22;
            text-decoration: none;
            font-weight: bold;
        }

        .messages {
            background: #eaf7ed;
            color: #218838;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="brand">
        <h1>Equip-Hire</h1>
        <p>Your trusted construction equipment marketplace</p>
    </div>

    <h2>Create Your Account</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="messages">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="register-button">
            Create Account
        </button>
    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </div>

    <a href="{% url 'home' %}" class="back-home">
        Back to Home
    </a>

</div>

</body>
</html>
