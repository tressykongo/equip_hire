
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Equipment - Equip-Hire</title>
</head>
<body>

    <h1>Equip-Hire</h1>
    <h2>Delete Equipment</h2>

    <p>Are you sure you want to delete this equipment?</p>

    <h3>{{ equipment.name }}</h3>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <p>
        <a href="{% url 'equipment_list' %}">Cancel</a>
    </p>

</body>
</html>
