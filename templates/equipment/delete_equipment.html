
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Equipment - Equip-Hire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #252525;
        }

        header {
            background: #252525;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            color: #f28c28;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .delete-card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #c62828;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .equipment-name {
            color: #252525;
            margin: 20px 0;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button, .cancel-link {
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #c62828;
            color: white;
        }

        button:hover {
            background: #a51f1f;
        }

        .cancel-link {
            background: #e5e5e5;
            color: #252525;
        }

        .cancel-link:hover {
            background: #d5d5d5;
        }

        @media (max-width: 500px) {
            .delete-card {
                padding: 25px 18px;
            }

            .actions {
                flex-direction: column;
            }

            button, .cancel-link {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Equip-Hire</h1>
</header>

<div class="container">

    {% include 'back_button.html' %}

    <div class="delete-card">

        <h2>Delete Equipment</h2>

        <p>Are you sure you want to delete this equipment?</p>

        <h3 class="equipment-name">{{ equipment.name }}</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="actions">
                <button type="submit">Yes, Delete</button>

                <a href="{% url 'equipment_list' %}" class="cancel-link">
                    Cancel
                </a>
            </div>
        </form>

    </div>

</div>

</body>
</html>
