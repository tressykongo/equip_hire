
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Equipment - Equip-Hire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #252525;
        }

        header {
            background: #252525;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            color: #f28c28;
            margin: 0;
        }

        header p {
            color: #ddd;
            margin: 5px 0 0;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .intro {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input[type="checkbox"] {
            width: auto;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #f28c28;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .errorlist {
            color: #c62828;
            font-size: 14px;
        }

        button {
            width: 100%;
            background: #f28c28;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d97716;
        }

        footer {
            background: #252525;
            color: #ccc;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Equip-Hire</h1>
    <p>Equipment Owner Portal</p>
</header>

<div class="container">

    {% include 'back_button.html' %}

    <div class="form-card">

        <h2>Add New Equipment</h2>

        <p class="intro">
            List your construction equipment for hire.
            Provide accurate details, pricing and location
            so renters can easily find your equipment.
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Save Equipment</button>
        </form>

    </div>

</div>

<footer>
    <p>&copy; 2026 Equip-Hire. All rights reserved.</p>
</footer>

</body>
</html>
